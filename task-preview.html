<!doctype html>
<html>
<head><meta charset="utf-8" /><title>preview</title></head>
<body style="background:#f4f4f5;margin:0">
<div id="root"></div>
<script type="module">
import './src/index.css';
import React from 'react';
import { createRoot } from 'react-dom/client';
import TaskCard from './src/features/board/TaskCard.jsx';
const base = { number: 3, source: 'Иванов Пётр · Квадратные уравнения', content: 'Решите уравнение $x^2 - 5x + 6 = 0$. Укажите больший корень.', options: ['$2$', '$3$', '$6$', '$-1$'], teacherOnly: { answer: '2', solution: 'По теореме Виета $x_1=2$, $x_2=3$.', studentAnswers: [{ name: 'Иванов Пётр', answer: '1' }] } };
const cards = [
  { props: { ...base, fontSize: 16 }, w: 448 },
  { props: { ...base, fontSize: 20 }, w: 560 },
  { props: { ...base, number: 4, fontSize: 20, options: [], openAnswer: true, content: 'Найдите площадь треугольника со сторонами 3, 4 и 5.', teacherOnly: { answer: '6', studentAnswers: [{ name: 'Иванов Пётр', answer: '12' }, { name: 'Сидорова Анна', answer: 'Нет ответа' }] } }, w: 560 },
];
createRoot(document.getElementById('root')).render(
  React.createElement('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 32, padding: 32, alignItems: 'flex-start' } },
    cards.map((card, i) => React.createElement('div', { key: i, style: { position: 'relative', width: card.w, flexShrink: 0, height: 560 } },
      React.createElement(TaskCard, { obj: { id: String(i), props: card.props }, teacher: true, onMeasure: () => {} })))));
</script>
</body>
</html>
