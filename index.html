<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Платформа тестирования</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('edu_theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
          root.style.backgroundColor = dark ? '#09090b' : '#fafafa';
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { background-color: #fafafa; }
      html.dark, html.dark body { background-color: #09090b; }
    </style>
  </head>
  <body class="bg-[#fafafa] min-h-screen dark:bg-[#09090b]">
    <div id="root"></div>
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
